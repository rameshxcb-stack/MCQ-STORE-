name: Build Encrypted Bundles

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build bundles
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BUNDLE_ENCRYPTION_KEY: ${{ secrets.BUNDLE_ENCRYPTION_KEY }}
        run: node scripts/build-encrypted-bundles.js

      - name: Commit and push bundles
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bundles/
          git commit -m "Auto-update encrypted bundles" || echo "No changes"
          git push
